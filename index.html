<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Khalid Mahmud Rahat | Portfolio</title>
<meta name="description" content="Portfolio of Khalid Mahmud Rahat, a CSE student at AIUB. UI/UX design, web development, and technology built to help people.">
<meta name="theme-color" content="#0a0a0a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0a;--card:#141414;--red:#e11d2e;--red2:#ff4d4d;--tx:#f4f4f5;--mut:#9a9aa2;--bd:#262626}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--tx);font:16px/1.65 Inter,system-ui,sans-serif;overflow-x:hidden}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--red2);outline-offset:3px}
nav{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;justify-content:space-between;align-items:center;padding:14px 5vw;background:rgba(10,10,10,.7);backdrop-filter:blur(10px)}
nav b{font:400 1.4rem Anton,sans-serif;letter-spacing:.04em}
nav b i{color:var(--red);font-style:normal}
nav div{display:flex;gap:22px;font-size:.92rem;color:var(--mut)}
nav div a:hover{color:var(--tx)}
.wrap{max-width:1120px;margin:0 auto;padding:110px 5vw 20px}
h2{font:400 clamp(2.6rem,7vw,5rem)/1 Anton,sans-serif;text-transform:uppercase;margin-bottom:12px}
h2 em{font-style:normal;color:var(--red)}
.sub{color:var(--mut);max-width:60ch;margin-bottom:36px}
/* hero */
.hero{position:relative;min-height:100vh;display:flex;align-items:flex-end;overflow:hidden;isolation:isolate}
.big{position:absolute;left:50%;top:13%;transform:translateX(-50%);font:400 clamp(5rem,23vw,22rem)/.9 Anton,sans-serif;color:var(--red);text-transform:uppercase;white-space:nowrap;z-index:1;background:linear-gradient(180deg,#ff2b3d,#8a0f1a);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
.me{position:absolute;left:50%;bottom:0;transform:translateX(-50%);height:88vh;max-width:90vw;object-fit:contain;z-index:2;-webkit-mask-image:linear-gradient(#000 82%,transparent);mask-image:linear-gradient(#000 82%,transparent);}
.hero::before{content:"";position:absolute;left:50%;bottom:0;width:min(90vw,820px);height:85%;transform:translateX(-50%);background:radial-gradient(ellipse at 50% 60%,rgba(225,29,46,.28),transparent 65%);z-index:1;pointer-events:none}
.hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:22%;background:linear-gradient(transparent,var(--bg));z-index:3}
.hero-t{position:relative;z-index:4;padding:0 5vw 9vh;max-width:520px}
.hero-t small{color:var(--mut);font-size:1rem}
.hero-t h1{font:400 clamp(2.6rem,6vw,4.6rem)/1 Anton,sans-serif;text-transform:uppercase;margin:6px 0 10px}
.role{color:var(--red2);font-weight:600;min-height:1.7em}
.role::after{content:"|";margin-left:2px;animation:blink 1s steps(1) infinite}
.hero-t p{color:#c9c9cf;margin:10px 0 22px}
.btn{display:inline-block;padding:12px 24px;border-radius:999px;font-weight:600;border:1px solid var(--red);margin:0 10px 10px 0;transition:.2s;cursor:pointer;background:none;color:var(--tx);font-family:inherit;font-size:1rem}
.btn.fill{background:var(--red)}
.btn:hover{background:var(--red2);border-color:var(--red2)}
.status{position:absolute;right:5vw;bottom:9vh;z-index:4;text-align:right;color:var(--mut);font-size:.9rem}
.status span{display:inline-block;width:9px;height:9px;border-radius:50%;background:#3ddc84;margin-right:8px}
@keyframes rise{from{opacity:0;transform:translate(-50%,40px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes blink{50%{opacity:0}}
/* projects */
.proj{display:grid;grid-template-columns:1.1fr 1fr;gap:34px;align-items:center;padding:34px 0;border-top:1px solid var(--bd)}
.proj:nth-child(even) .pimg{order:2}
.pimg{aspect-ratio:16/10;border-radius:12px;overflow:hidden;background:linear-gradient(135deg,#2a0a0e,#141414);border:1px solid var(--bd)}
.pimg img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s}
.proj:hover .pimg img{transform:scale(1.04)}
.cat{color:var(--red2);font-size:.9rem;font-weight:600}
.proj h3{font:400 2.4rem/1.1 Anton,sans-serif;text-transform:uppercase;margin:4px 0 8px}
.proj p{color:#c9c9cf}
.proj ul{margin:12px 0 0 18px;color:var(--mut);font-size:.93rem}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.tags span,.chips span{border:1px solid var(--bd);border-radius:999px;padding:3px 13px;font-size:.85rem;color:#d8d8dd;background:var(--card)}
/* about */
.about{display:grid;grid-template-columns:1.2fr 1fr;gap:40px;align-items:start}
.about p{font-size:1.15rem;color:#d8d8dd;max-width:56ch}
.cnt{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.cnt div{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:20px}
.cnt b{display:block;font:400 3rem/1 Anton,sans-serif;color:var(--red)}
.cnt span{color:var(--mut);font-size:.9rem}
/* skills */
.sk{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:26px}
.sk h4{font:400 1.5rem Anton,sans-serif;text-transform:uppercase;margin-bottom:12px;color:var(--red2)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
/* timeline */
.two{display:grid;grid-template-columns:1fr 1fr;gap:44px}
.tl{border-left:2px solid var(--red);padding-left:22px;display:grid;gap:26px}
.tl small{color:var(--red2);font-weight:600}
.tl h4{font-size:1.1rem;margin:2px 0}
.tl em{font-style:normal;color:var(--mut);font-size:.92rem}
.tl p{color:#c9c9cf;font-size:.93rem;margin-top:4px}
/* contact */
.ct{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:clamp(24px,5vw,56px);display:grid;grid-template-columns:1fr 1fr;gap:40px}
.ct h2{font-size:clamp(2.4rem,6vw,4.4rem)}
.ct a.l{display:block;color:#d8d8dd;margin:4px 0}
.ct a.l:hover{color:var(--red2)}
form{display:grid;gap:12px}
input,textarea{width:100%;background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:12px 14px;color:var(--tx);font:inherit}
input:focus,textarea:focus{border-color:var(--red);outline:none}
footer{text-align:center;color:var(--mut);padding:40px 5vw;font-size:.9rem}

/* design-editor effect */
.sel{opacity:0;filter:blur(5px)}
h2.sel,.btns,.proj .acts{display:inline-block}
.proj ul,.proj .tags{width:fit-content;max-width:100%}
.proj .acts{margin-top:16px}
.sel.in{opacity:1;filter:none;transition:opacity .45s,filter .45s}
.pop{opacity:0;transform:scale(.8)}
.sel.in .pop{opacity:1;transform:none;transition:opacity .35s calc(var(--i,0)*70ms + 300ms),transform .35s calc(var(--i,0)*70ms + 300ms)}
#boxes{position:fixed;inset:0;z-index:55;pointer-events:none;overflow:hidden}
.box{position:absolute;left:0;top:0;border:1px solid #3b82f6;opacity:0;transition:opacity .25s,background .4s}
.box.ph{background:rgba(150,157,170,.32)}
.box.out{opacity:0!important}
.box s{position:absolute;width:7px;height:7px;background:#fff;border:1px solid #3b82f6}
.box s:nth-of-type(1){left:-4px;top:-4px}.box s:nth-of-type(2){right:-4px;top:-4px}
.box s:nth-of-type(3){left:-4px;bottom:-4px}.box s:nth-of-type(4){right:-4px;bottom:-4px}
.box kbd{position:absolute;right:-1px;bottom:-24px;background:#3b82f6;color:#fff;font:600 10px Inter,sans-serif;padding:2px 6px;border-radius:3px;white-space:nowrap}
.box var{position:absolute;left:-1px;top:-19px;background:#3b82f6;color:#fff;font:600 10px Inter,sans-serif;font-style:normal;padding:1px 6px;border-radius:3px}
#guides{position:fixed;inset:0;z-index:45;pointer-events:none;transition:opacity .6s}
.gv,.gh{position:absolute;background:rgba(59,130,246,.55)}
.gv{top:0;bottom:0;width:1px;transform:scaleY(0);transform-origin:top;animation:gl 1s ease-out forwards}
.gh{left:0;right:0;height:1px;transform:scaleX(0);transform-origin:left;animation:gl 1s .15s ease-out forwards}
.gp{position:absolute;color:#60a5fa;font:400 16px/1 Inter,sans-serif;transform:translate(-50%,-50%);font-style:normal}
@keyframes gl{to{transform:none}}
#cur{position:fixed;inset:0;z-index:60;pointer-events:none;overflow:hidden}
.cu{position:absolute;left:0;top:0;filter:drop-shadow(0 1px 2px rgba(0,0,0,.6));will-change:transform}
.cv{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:34px;align-items:start}
.cvbox{aspect-ratio:auto;height:min(82vh,780px);background:#fff}
.cvbox iframe{width:100%;height:100%;border:0;display:block}
.cvside h3{font:400 2rem/1.1 Anton,sans-serif;text-transform:uppercase;margin-bottom:8px;width:fit-content}
.cvside p{color:#c9c9cf;margin-bottom:14px;width:fit-content;max-width:100%}
.rbtns{display:inline-block}
.tabs{display:flex;gap:8px;margin-bottom:12px;width:fit-content}
.tab{font:inherit;font-weight:600;padding:8px 22px;border-radius:999px;border:1px solid var(--bd);background:var(--card);color:var(--mut);cursor:pointer;transition:.2s}
.tab:hover{color:var(--tx)}
.tab.on{background:var(--red);border-color:var(--red);color:#fff}
.doc{margin-bottom:30px}
.soc{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;width:fit-content;margin:0 auto 20px}
.soc a{width:48px;height:48px;display:grid;place-items:center;border:1px solid var(--bd);border-radius:50%;background:var(--card);color:var(--tx);transition:.2s}
.soc a:hover{background:var(--red);border-color:var(--red);transform:translateY(-3px)}
.soc svg{width:21px;height:21px;fill:currentColor}
@media(max-width:820px){
 nav div{display:none}
 .proj,.about,.two,.ct,.cv{grid-template-columns:1fr}.cvbox,.tabs{display:none}
 .proj:nth-child(even) .pimg{order:0}
 .hero{align-items:flex-end}
 .me{height:46vh;top:14%;bottom:auto}.big{top:8%}
 .status{display:none}
 .hero-t{padding-top:54vh;padding-bottom:6vh}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.sel,.pop{opacity:1;transform:none;filter:none}html{scroll-behavior:auto}}
</style>
<noscript><style>.sel,.pop{opacity:1;transform:none;filter:none}</style></noscript>
</head>

<main id="app"></main>

/* design-editor effect: cursors drag real selection boxes, then the content is "pasted" in */
(() => {
  const SEL = "nav b,nav div,.big,.me,.hero-t small,.hero-t h1,.role,.hero-t p,.btns,.status,.wrap > h2,.two h2,.sub,.proj .pimg,.proj .cat,.proj h3,.proj p,.proj ul,.proj .tags,.proj .acts,.about p,.cnt > div,.sk > div,.tl > div,.ct > *,.sel-it";

  sels.forEach(e => e.classList.add("sel"));
  document.querySelectorAll(".chips,.tags").forEach(g => [...g.children].forEach((c, i) => { c.classList.add("pop"); c.style.setProperty("--i", i); }));
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) {
    sels.forEach(e => e.classList.add("in"));
    ["guides","cur","boxes"].forEach(i => document.getElementById(i).remove()); return;
  }
  /* intro: blue guide lines */
  const g = document.getElementById("guides"), V = [8,50,92], H = [20,52,88];
  g.innerHTML = V.map(v=>`<span class="gv" style="left:${v}%"></span>`).join("") + H.map(h=>`<span class="gh" style="top:${h}%"></span>`).join("")
    + V.flatMap(v=>H.map(h=>`<i class="gp" style="left:${v}%;top:${h}%">+</i>`)).join("");
  setTimeout(() => g.style.opacity = 0, 3400); setTimeout(() => g.remove(), 4100);

  /* a swarm of small cursors, bunched at the bottom at first */
  const cols = ["#22d3a0","#ff6ec7","#22d3ee","#a78bfa","#fb923c","#facc15","#60a5fa","#f87171"], n = innerWidth < 820 ? 14 : 34, layer = document.getElementById("cur");
  layer.innerHTML = Array.from({length:n}, (_, i) => `<svg class="cu" width="13" height="18" viewBox="0 0 14 20"><path d="M1 1v15l4-3.6 3 6.6 2.6-1.2-3-6.4H13z" fill="${cols[i % cols.length]}" stroke="#fff" stroke-width="1"/></svg>`).join("");
  const rnd = () => ({x:Math.random()*innerWidth, y:innerHeight*(.35+Math.random()*.65)});
  const cs = [...layer.children].map(e => { const x = innerWidth/2 + (Math.random()-.5)*160, y = innerHeight - 40 + (Math.random()-.5)*50; return {e, x, y, tx:x, ty:y, t:performance.now()+1000, job:null, ctl:null}; });
  const ease = p => p < .5 ? 2*p*p : 1 - Math.pow(-2*p + 2, 2) / 2;
  const act = [], boxes = document.getElementById("boxes");

  /* one selection: approach the top-left, drag to the bottom-right, paste the content, release */
  const begin = (el, c) => {
    const b = document.createElement("div"); b.className = "box" + (el.matches(".me,.pimg") ? " ph" : "");
    const tag = el.matches(".me,.pimg") ? "image" : el.tagName.toLowerCase();
    b.innerHTML = "<var>" + tag + "</var><s></s><s></s><s></s><s></s><kbd></kbd>";
    boxes.appendChild(b); c.ctl = true; c.job = null;
    act.push({el, c, b, ph:0, t:performance.now(), k:b.querySelector("kbd")});
  };
  const step = (S, now) => {
    const {el, c, b} = S, r = el.getBoundingClientRect();
    const x0 = r.left - 10, y0 = r.top - 8, x1 = r.right + 10, y1 = r.bottom + 8;
    const draw = (w, h) => { b.style.transform = `translate(${x0}px,${y0}px)`; b.style.width = w + "px"; b.style.height = h + "px"; S.k.textContent = Math.round(r.width) + " × " + Math.round(r.height); };
    if (S.ph === 0) {
      c.x += (x0 - c.x) * .16; c.y += (y0 - c.y) * .16;
      if (Math.hypot(x0 - c.x, y0 - c.y) < 8 || now - S.t > 1100) { S.ph = 1; S.t = now; S.D = Math.min(1300, 550 + r.width * .6); b.style.opacity = 1; }
    } else if (S.ph === 1) {
      const e = ease(Math.min(1, (now - S.t) / S.D));
      c.x = x0 + (x1 - x0) * e; c.y = y0 + (y1 - y0) * e;
      draw(c.x - x0, c.y - y0);
      if (now - S.t >= S.D) {
        S.ph = 2; S.t = now; el.classList.add("in"); b.classList.remove("ph");
        [[1,0],[0,1]].forEach(([fx, fy]) => { const f = cs.find(k => !k.ctl && !k.job); if (f) f.job = {el, fx, fy, until:now + 1100}; });
      }
    } else if (S.ph === 2) {
      c.x = x1; c.y = y1; draw(x1 - x0, y1 - y0);
      if (now - S.t > 900) { S.ph = 3; S.t = now; b.classList.add("out"); }
    } else {
      if (now - S.t > 450) { b.remove(); c.ctl = null; c.t = 0; return true; }
    }
    return false;
  };
  (function loop(now){
    for (let i = act.length - 1; i >= 0; i--) if (step(act[i], now)) act.splice(i, 1);
    for (const c of cs) {
      if (!c.ctl) {
        if (c.job) {
          if (now > c.job.until) c.job = null;
          else { const r = c.job.el.getBoundingClientRect(); c.tx = r.left + r.width * c.job.fx; c.ty = r.top + r.height * c.job.fy; }
        }
        if (!c.job && now > c.t) { const p = rnd(); c.tx = p.x; c.ty = p.y; c.t = now + 1500 + Math.random()*2500; }
        const k = c.job ? .1 : .014; c.x += (c.tx - c.x) * k; c.y += (c.ty - c.y) * k;
      }
      c.e.style.transform = `translate(${c.x}px,${c.y}px)`;
    }
    requestAnimationFrame(loop);
  })(performance.now());
  /* scrolling pulls idle cursors toward the lower part of the screen, where new content appears */
  let lastY = scrollY;
  addEventListener("scroll", () => {
    if (Math.abs(scrollY - lastY) < 40) return; lastY = scrollY;
    cs.forEach(c => { if (!c.ctl && !c.job && Math.random() < .5) c.t = 0; });
  }, {passive:true});

  /* queue: one new selection every 200 ms, each with its own cursor */
  const q = [], push = el => { el._qt = performance.now(); q.push(el); };
  setInterval(() => {
    const now = performance.now();
    while (q.length && now - q[0]._qt > 2500) q.shift().classList.add("in");   /* never leave content hidden for long */
    for (let n = 0; n < (q.length > 6 ? 2 : 1) && q.length; n++) {
      const el = q[0], r = el.getBoundingClientRect();
      if (r.width < 2 || r.height < 2 || r.bottom < 0 || r.top > innerHeight) { q.shift(); el.classList.add("in"); continue; }
      const free = cs.filter(c => !c.ctl && !c.job); if (!free.length) break;
      q.shift(); begin(el, free[Math.random()*free.length|0]);
    }
  }, 200);

  /* intro: cursors build the hero piece by piece */
  const intro = [[".big",700],[".me",1150],["nav b",1500],["nav div",1650],[".hero-t small",1700],[".hero-t h1",1900],[".role",2250],[".hero-t p",2450],[".btns",2650],[".status",2850]];
  const skip = new Set(intro.map(([s, d]) => { const el = document.querySelector(s); setTimeout(() => push(el), d); return el; }));
  /* scrolling: every block gets selected and filled when it comes into view */
  const io = new IntersectionObserver(es => es.forEach(en => {
    if (!en.isIntersecting) return; io.unobserve(en.target); push(en.target);
  }), {threshold:.1, rootMargin:"0px 0px -6% 0px"});
  sels.forEach(e => { if (!skip.has(e)) io.observe(e); });
})();
</script>
